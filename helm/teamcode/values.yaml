# All server replicas share MySQL and the same encryption key; no sticky sessions or Redis required.
replicaCount: 3
image:
  repository: nathanfallet/teamcode
  tag: latest
  pullPolicy: Always
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Required: the external origin, with no trailing slash, used for dashboard form validation.
publicUrl: ""
# Provision separately. Helm never generates or rotates provider encryption keys.
# Keys: mysql-username, mysql-password, encryption-key; mysql-root-password when bundled MySQL is enabled.
existingSecret: teamcode-secrets
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext:
  fsGroup: 10001
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
initContainers: []
service:
  type: ClusterIP
  port: 8080
# Allows a 10-minute stream plus load-balancer propagation and shutdown overhead.
terminationGracePeriodSeconds: 660
podDisruptionBudget:
  enabled: true
  minAvailable: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "660"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "660"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts: []
  tls: []
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 1Gi
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 60
  timeoutSeconds: 2
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 2
readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 10
  failureThreshold: 2
  timeoutSeconds: 8
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
extraEnv: []
javaToolOptions: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"

# Network access of cloud session pods. Before every session pod, the server applies the NetworkPolicy
# `teamcode-sessions` to the session namespace (it needs `patch` on networkpolicies there): no ingress, egress to DNS
# and, with `internet`, to public addresses only (link-local and cloud metadata, RFC 1918, carrier-grade NAT and
# unique-local ranges are excluded). An operator setting on purpose: a dashboard administrator cannot widen it.
# See docs/cloud-sessions.md#session-network-policy.
cloudSessions:
  networkPolicy:
    # false leaves session pods unrestricted unless the cluster's own policies apply; not recommended.
    enabled: true
    # false: only DNS and `extraEgress` (the TeamCode server, git hosts, a registry mirror or proxy must be listed).
    internet: true
    # Further CIDRs removed from the internet rule, for a pod, service or node range outside the private ranges.
    blockedCidrs: []
    # NetworkPolicy egress rules appended verbatim (`to` and `ports` only; an ipBlock may not reach link-local), for
    # example the ingress controller when session pods reach the server URL inside the cluster:
    # - to:
    #     - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
    #   ports: [{protocol: TCP, port: 443}]
    extraEgress: []

# Optional single MySQL instance for a self-contained installation, using the tested official 8.4 image.
# For production HA, disable this and supply an externally managed MySQL 8.4 JDBC URL below.
mysql:
  enabled: true
  image: mysql:8.4
  database: teamcode
  jdbcUrl: ""
  # Ingress to the bundled MySQL only from the TeamCode server pods of this release, on 3306.
  networkPolicy:
    enabled: true
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
