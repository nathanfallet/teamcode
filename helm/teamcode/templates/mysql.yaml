{{- if hasKey .Values.mysql "primary" }}
{{- fail "mysql.primary is not a key of this chart (it is the Bitnami chart's): set the bundled MySQL's requests and limits under mysql.resources" }}
{{- end }}
{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "teamcode.mysql.fullname" . }}
  labels:
    {{- include "teamcode.labels" . | nindent 4 }}
data:
  teamcode.cnf: |
    {{- .Values.mysql.config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "teamcode.mysql.fullname" . }}
  labels:
    {{- include "teamcode.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/name: {{ include "teamcode.mysql.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "teamcode.mysql.fullname" . }}
  labels:
    {{- include "teamcode.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "teamcode.mysql.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "teamcode.mysql.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "teamcode.mysql.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/mysql-config: {{ .Values.mysql.config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: {{ .Values.mysql.image | quote }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-root-password
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT 1" > /dev/null']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/teamcode.cnf
              subPath: teamcode.cnf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "teamcode.mysql.fullname" . }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.mysql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ include "teamcode.mysql.storageSize" (dict "explicit" .Values.mysql.persistence.size "existing" (lookup "apps/v1" "StatefulSet" .Release.Namespace (include "teamcode.mysql.fullname" .))) }}
{{- end }}
