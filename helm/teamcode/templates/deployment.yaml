apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teamcode.fullname" . }}
  labels:
    {{- include "teamcode.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "teamcode.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "teamcode.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "teamcode.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: teamcode
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "sleep 10"]
          env:
            - name: TEAMCODE_HOST
              value: "0.0.0.0"
            - name: TEAMCODE_PORT
              value: "8080"
            - name: TEAMCODE_MODE
              value: server
            - name: TEAMCODE_SHUTDOWN_GRACE_MS
              value: "600000"
            - name: TEAMCODE_PUBLIC_URL
              value: {{ required "Set publicUrl to your externally accessible TeamCode origin" .Values.publicUrl | quote }}
            - name: TEAMCODE_DATABASE_URL
              value: {{ include "teamcode.databaseUrl" . | quote }}
            - name: TEAMCODE_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-username
            - name: TEAMCODE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-password
            - name: TEAMCODE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: encryption-key
            - name: TEAMCODE_CLOUD_SESSION_NETWORK_POLICY
              value: {{ .Values.cloudSessions.networkPolicy.enabled | quote }}
            - name: TEAMCODE_CLOUD_SESSION_EGRESS_LOCKDOWN
              value: {{ .Values.cloudSessions.networkPolicy.lockdown | quote }}
            - name: TEAMCODE_CLOUD_SESSION_EGRESS_BLOCKED_CIDRS
              value: {{ join "," .Values.cloudSessions.networkPolicy.blockedCidrs | quote }}
            - name: TEAMCODE_CLOUD_SESSION_EGRESS_EXTRA
              value: {{ toJson .Values.cloudSessions.networkPolicy.extraEgress | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaToolOptions | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
