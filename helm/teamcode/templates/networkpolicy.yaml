{{- if and .Values.mysql.enabled (dig "networkPolicy" "enabled" true .Values.mysql) }}
# Only this release's TeamCode server pods reach the bundled MySQL. Enforced by CNIs that implement NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "teamcode.mysql.fullname" . }}
  labels:
    {{- include "teamcode.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "teamcode.mysql.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "teamcode.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3306
{{- end }}
