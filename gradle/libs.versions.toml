[versions]
kotlin = "2.4.20"
agp = "9.4.1"
android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"
# The app compiles against 37: OkHttp 5.5 (Ktor's Android engine) requires it.
android-appCompileSdk = "37"
# Companion app (Compose Multiplatform), the versions of nutrimaxing-app.
compose-multiplatform = "1.11.1"
compose-material3 = "1.11.0-alpha07"
androidx-lifecycle = "2.11.0-beta01"
androidx-navigation = "2.9.2"
androidx-activity = "1.13.0"
coroutines-ui = "1.10.2"
multiplatform-settings = "1.3.0"
phosphor-icon = "1.0.0"
java-keyring = "1.0.4"
markdown-renderer = "0.45.0"
ktor = "3.6.0"
serialization = "1.9.0"
coroutines = "1.9.0"
koin = "4.2.1"
clikt = "5.1.0"
mordant = "3.0.2"
okio = "3.18.2"
junit = "5.11.4"
logback = "1.5.20"
maven = "0.37.0"
snakeyaml-engine = "2.7"

exposed = "1.5.0"
hikari = "5.1.0"
flyway = "13.7.0"
mysql = "8.0.33"
testcontainers = "2.0.5"

[plugins]
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
exposed = { id = "org.jetbrains.exposed.plugin", version.ref = "exposed" }
jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
maven = { id = "com.vanniktech.maven.publish", version.ref = "maven" }

[libraries]
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-migration-jdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
