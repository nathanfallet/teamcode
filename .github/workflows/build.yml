name: Build
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Run all five native platforms and signed installation acceptance (paid macOS/Windows runners)'
        type: boolean
        default: false
      validation_version:
        description: 'Exact stable version for full validation; publication remains off unless publish_release is selected'
        type: string
        default: ''
      publish_release:
        description: 'After full stable validation on main, publish its image and create the exact tag/release without rebuilding'
        type: boolean
        default: false
env:
  ORG_GRADLE_PROJECT_teamcodeVersion: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.full_validation && inputs.validation_version) || '1.0.0-SNAPSHOT' }}
  TEAMCODE_INSTALLATION_VERSION: 0.0.0-installation.g${{ github.sha }}
  # The Apple Team ID of the desktop app's Developer ID (public): compiled into the CLI, whose `teamcode ui` installs a
  # macOS app only when its signature names this team. Empty when the repository variable is not set.
  ORG_GRADLE_PROJECT_teamcodeMacosTeamId: ${{ vars.TEAMCODE_MACOS_TEAM_ID }}
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && format('publish-{0}', inputs.validation_version) || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
jobs:
  jvm:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/release-request.py
      - run: python3 scripts/check-module-graph.py
      - run: python3 -m unittest discover -s scripts -p 'test_acceptance_*.py'
      - run: python3 -m unittest discover -s scripts -p 'test_release_*.py'
      - run: ./gradlew :api:jvmTest :client:jvmTest :client:testAndroidHostTest :api:compileAndroidMain :domain:test :infrastructure:test :presentation:test :config:jvmTest :cli:jvmTest :app:test :app:buildFatJar
      - run: python3 scripts/smoke-replicas.py --jar app/build/libs/app-all.jar
      - uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: app/build/libs/app-all.jar
          retention-days: 1
  companion:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the Android platform the app compiles against
        # `yes` ends on SIGPIPE once sdkmanager exits; that status must not fail the step under pipefail.
        run: '{ yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null'
      - run: ./gradlew :companion:jvmTest :companion-desktop:test :companion:testAndroidHostTest :companion-android:assembleDebug
  helm:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/check-helm.py
      - name: Package the chart with the exact build version
        run: helm package helm/teamcode --destination chart-dist --version "$ORG_GRADLE_PROJECT_teamcodeVersion" --app-version "$ORG_GRADLE_PROJECT_teamcodeVersion"
      - name: Validate Kubernetes schemas
        run: |
          curl --fail --location --retry 2 https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template teamcode "chart-dist/teamcode-${ORG_GRADLE_PROJECT_teamcodeVersion}.tgz" --set publicUrl=https://teamcode.example.org | ./kubeconform -strict -summary
          helm template teamcode "chart-dist/teamcode-${ORG_GRADLE_PROJECT_teamcodeVersion}.tgz" --set publicUrl=https://teamcode.example.org --set mysql.enabled=false --set mysql.jdbcUrl=jdbc:mysql://db:3306/teamcode --set autoscaling.enabled=true | ./kubeconform -strict -summary
      - uses: actions/upload-artifact@v4
        with:
          name: teamcode-helm-chart
          path: chart-dist/*.tgz
          retention-days: 7
  image:
    timeout-minutes: 20
    needs: [jvm, helm, signed_installation]
    if: >-
      !cancelled() && needs.jvm.result == 'success' && needs.helm.result == 'success' &&
      (needs.signed_installation.result == 'success' ||
      (needs.signed_installation.result == 'skipped' &&
      github.ref_type != 'tag' &&
      !(github.event_name == 'workflow_dispatch' && inputs.full_validation)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select image tags
        run: |
          if [ "${{ github.ref_type }}" = tag ] || [ "${{ github.event_name }}" = workflow_dispatch -a "${{ inputs.publish_release }}" = true ]; then
            echo "IMAGE_TAGS=${ORG_GRADLE_PROJECT_teamcodeVersion},sha-${GITHUB_SHA}-${ORG_GRADLE_PROJECT_teamcodeVersion}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAGS=latest,sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi
      - name: Build the image without pushing
        if: ${{ !((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.full_validation && github.ref == 'refs/heads/main')) }}
        run: ./gradlew :app:buildImage -PimagePlatforms=amd64 "-PimageTags=${IMAGE_TAGS}"
      - name: Build and push the multi-architecture image
        if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.full_validation && github.ref == 'refs/heads/main') }}
        env:
          DOCKER_HUB_USERNAME: nathanfallet
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: ./gradlew :app:publishImage "-PimageTags=${IMAGE_TAGS}"
  native:
    # Keep paid native runners off ordinary pushes and pull requests.
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux transport dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Select native target
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) target=MacosArm64; directory=macosArm64; asset=macos-arm64 ;;
            Darwin-x86_64) target=MacosX64; directory=macosX64; asset=macos-x64 ;;
            Linux-x86_64) target=LinuxX64; directory=linuxX64; asset=linux-x64 ;;
            *) echo 'Unsupported runner architecture'; exit 1 ;;
          esac
          {
            echo "NATIVE_TARGET=$target"
            echo "NATIVE_DIRECTORY=$directory"
            echo "NATIVE_ASSET=$asset"
            echo "TEAMCODE_VERSION=${ORG_GRADLE_PROJECT_teamcodeVersion}"
          } >> "$GITHUB_ENV"
      - run: ./gradlew ":cli:linkReleaseExecutable${NATIVE_TARGET}" ":cli:linkDebugTest${NATIVE_TARGET}" ":config:linkDebugTest${NATIVE_TARGET}" :app:buildFatJar
      - run: '"cli/build/bin/${NATIVE_DIRECTORY}/debugTest/test.kexe"'
      - run: '"config/build/bin/${NATIVE_DIRECTORY}/debugTest/test.kexe"'
      - run: python3 scripts/smoke-release-verification.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe"
      - run: python3 scripts/smoke-native.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --jar app/build/libs/app-all.jar --expected-version "$TEAMCODE_VERSION"
      - run: python3 scripts/smoke-devices.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe"
      - run: python3 scripts/smoke-run.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --jar app/build/libs/app-all.jar
      - run: python3 scripts/smoke-queued-cancel.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe"
      - run: python3 scripts/smoke-hook.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe"
      - name: Start Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          {
            echo "XDG_RUNTIME_DIR=/run/user/$(id -u)"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus"
          } >> "$GITHUB_ENV"
      - run: python3 scripts/smoke-service.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe"
      - name: Exercise owned boot startup without a user login trigger
        run: python3 scripts/smoke-service.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --at-boot
      - name: Verify persistent team setup with the native CLI
        if: runner.os == 'Linux'
        run: python3 scripts/smoke-team.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --jar app/build/libs/app-all.jar
      - name: Stage the tested native release asset
        run: python3 scripts/release-bundle.py stage --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --target "$NATIVE_ASSET" --version "$TEAMCODE_VERSION" --commit "$GITHUB_SHA" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.NATIVE_ASSET }}
          path: dist/*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: teamcode-${{ env.NATIVE_DIRECTORY }}
          path: cli/build/bin/${{ env.NATIVE_DIRECTORY }}/releaseExecutable/teamcode.kexe
          retention-days: 7
      - name: Compile a distinct version of the same source for installation acceptance
        run: ./gradlew "-PteamcodeVersion=$TEAMCODE_INSTALLATION_VERSION" ":cli:linkReleaseExecutable${NATIVE_TARGET}"
      - name: Stage the actual installation-baseline executable
        run: python3 scripts/release-bundle.py stage --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --target "$NATIVE_ASSET" --version "$TEAMCODE_INSTALLATION_VERSION" --commit "$GITHUB_SHA" --output installation-dist
      - uses: actions/upload-artifact@v4
        with:
          name: installation-release-${{ env.NATIVE_ASSET }}
          path: installation-dist/*
          retention-days: 7
  windows:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat :cli:linkReleaseExecutableMingwX64 :cli:linkDebugTestMingwX64 :config:linkDebugTestMingwX64
      - run: .\cli\build\bin\mingwX64\debugTest\test.exe
      - run: .\config\build\bin\mingwX64\debugTest\test.exe
      # The desktop app's private files and lock on Windows: owner-only ACL entries written by the JVM.
      - run: .\gradlew.bat :config:jvmTest
      - run: python scripts/smoke-release-verification.py --binary cli/build/bin/mingwX64/releaseExecutable/teamcode.exe
      - run: python scripts/smoke-windows.py --binary cli/build/bin/mingwX64/releaseExecutable/teamcode.exe --allow-machine-test-certificate
      - run: python scripts/smoke-devices.py --binary cli/build/bin/mingwX64/releaseExecutable/teamcode.exe
      - run: python scripts/smoke-queued-cancel.py --binary cli/build/bin/mingwX64/releaseExecutable/teamcode.exe
      - run: python scripts/smoke-hook.py --binary cli/build/bin/mingwX64/releaseExecutable/teamcode.exe
      - name: Stage the tested native release asset
        shell: pwsh
        run: |
          $releaseVersion = $env:ORG_GRADLE_PROJECT_teamcodeVersion
          python scripts/release-bundle.py stage --binary cli/build/bin/mingwX64/releaseExecutable/teamcode.exe --target windows-x64 --version $releaseVersion --commit $env:GITHUB_SHA --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: teamcode-windows-x64
          path: cli/build/bin/mingwX64/releaseExecutable/teamcode.exe
          retention-days: 7
      - name: Compile a distinct version of the same source for installation acceptance
        shell: pwsh
        run: .\gradlew.bat "-PteamcodeVersion=$env:TEAMCODE_INSTALLATION_VERSION" :cli:linkReleaseExecutableMingwX64
      - name: Stage the actual installation-baseline executable
        shell: pwsh
        run: python scripts/release-bundle.py stage --binary cli/build/bin/mingwX64/releaseExecutable/teamcode.exe --target windows-x64 --version $env:TEAMCODE_INSTALLATION_VERSION --commit $env:GITHUB_SHA --output installation-dist
      - uses: actions/upload-artifact@v4
        with:
          name: installation-release-windows-x64
          path: installation-dist/*
          retention-days: 7

  cross_build:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: LinuxArm64
            directory: linuxArm64
            asset: linux-arm64
          - os: macos-latest
            target: MacosX64
            directory: macosX64
            asset: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: ./gradlew ":cli:linkReleaseExecutable${NATIVE_TARGET}" ":cli:linkDebugTest${NATIVE_TARGET}"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-tests-${{ matrix.asset }}
          path: cli/build/bin/${{ matrix.directory }}/debugTest/test.kexe
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.asset }}
          path: cli/build/bin/${{ matrix.directory }}/releaseExecutable/teamcode.kexe
          retention-days: 1
      - name: Compile the distinct installation-baseline version
        run: ./gradlew "-PteamcodeVersion=$TEAMCODE_INSTALLATION_VERSION" ":cli:linkReleaseExecutable${NATIVE_TARGET}"
      - uses: actions/upload-artifact@v4
        with:
          name: installation-candidate-${{ matrix.asset }}
          path: cli/build/bin/${{ matrix.directory }}/releaseExecutable/teamcode.kexe
          retention-days: 1
  cross_native:
    timeout-minutes: 20
    needs: [cross_build, jvm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            directory: linuxArm64
            asset: linux-arm64
            architecture: aarch64
          - os: macos-15-intel
            directory: macosX64
            asset: macos-x64
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_DIRECTORY: ${{ matrix.directory }}
      NATIVE_ASSET: ${{ matrix.asset }}
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ matrix.asset }}
          path: cli/build/bin/${{ matrix.directory }}/releaseExecutable
      - uses: actions/download-artifact@v4
        with:
          name: candidate-tests-${{ matrix.asset }}
          path: cli/build/bin/${{ matrix.directory }}/debugTest
      - uses: actions/download-artifact@v4
        with:
          name: installation-candidate-${{ matrix.asset }}
          path: installation-candidate
      - uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: app/build/libs
      - name: Select the actual target runtime
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
          chmod 755 "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" "cli/build/bin/${NATIVE_DIRECTORY}/debugTest/test.kexe"
          echo "TEAMCODE_VERSION=${ORG_GRADLE_PROJECT_teamcodeVersion}" >> "$GITHUB_ENV"
      - run: '"cli/build/bin/${NATIVE_DIRECTORY}/debugTest/test.kexe"'
      - run: python3 scripts/smoke-release-verification.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe"
      - run: python3 scripts/smoke-native.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --jar app/build/libs/app-all.jar --expected-version "$TEAMCODE_VERSION"
      - run: python3 scripts/smoke-devices.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe"
      - run: python3 scripts/smoke-run.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --jar app/build/libs/app-all.jar
      - run: python3 scripts/smoke-queued-cancel.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe"
      - run: python3 scripts/smoke-hook.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe"
      - name: Start Linux user service manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          {
            echo "XDG_RUNTIME_DIR=/run/user/$(id -u)"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus"
          } >> "$GITHUB_ENV"
      - run: python3 scripts/smoke-service.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe"
      - name: Exercise owned boot startup without a user login trigger
        run: python3 scripts/smoke-service.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --at-boot
      - if: runner.os == 'Linux'
        run: python3 scripts/smoke-team.py --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --jar app/build/libs/app-all.jar
      - name: Stage the tested native release asset
        run: python3 scripts/release-bundle.py stage --binary "cli/build/bin/${NATIVE_DIRECTORY}/releaseExecutable/teamcode.kexe" --target "$NATIVE_ASSET" --version "$TEAMCODE_VERSION" --commit "$GITHUB_SHA" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          retention-days: 7
      - name: Stage the baseline version on its actual OS and CPU
        run: |
          chmod 755 installation-candidate/teamcode.kexe
          python3 scripts/release-bundle.py stage --binary installation-candidate/teamcode.kexe --target "$NATIVE_ASSET" --version "$TEAMCODE_INSTALLATION_VERSION" --commit "$GITHUB_SHA" --output installation-dist
      - uses: actions/upload-artifact@v4
        with:
          name: installation-release-${{ matrix.asset }}
          path: installation-dist/*
          retention-days: 7
  bundle:
    timeout-minutes: 5
    needs: [native, windows, cross_native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: staged
      - name: Verify and assemble all five tested targets
        run: python3 scripts/release-bundle.py assemble --inputs staged --version "${ORG_GRADLE_PROJECT_teamcodeVersion}" --commit "$GITHUB_SHA" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: teamcode-release-bundle
          path: dist/*
          retention-days: 7
      - uses: actions/download-artifact@v4
        with:
          pattern: installation-release-*
          merge-multiple: true
          path: installation-staged
      - name: Verify and assemble all five distinct-version baselines
        run: python3 scripts/release-bundle.py assemble --inputs installation-staged --version "$TEAMCODE_INSTALLATION_VERSION" --commit "$GITHUB_SHA" --output installation-dist
      - uses: actions/upload-artifact@v4
        with:
          name: teamcode-installation-bundle
          path: installation-dist/*
          retention-days: 7
  signed_bundle:
    timeout-minutes: 5
    # Pull-request code never receives the publisher key, including same-repository PRs.
    if: github.event_name != 'pull_request'
    needs: [bundle]
    runs-on: ubuntu-latest
    outputs:
      install_sh_sha256: ${{ steps.installers.outputs.install_sh_sha256 }}
      install_ps1_sha256: ${{ steps.installers.outputs.install_ps1_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: teamcode-release-bundle
          path: dist
      - name: Sign the exact release manifest with the independent publisher key
        env:
          TEAMCODE_RELEASE_SIGNING_KEY: ${{ secrets.TEAMCODE_RELEASE_SIGNING_KEY }}
        run: python3 scripts/release-signature.py sign --manifest dist/manifest.json --signature dist/manifest.sig --public-key release/trust/teamcode-release-2026.pem
      - name: Verify the published signature against the pinned public key
        run: python3 scripts/release-signature.py verify --manifest dist/manifest.json --signature dist/manifest.sig --public-key release/trust/teamcode-release-2026.pem
      - name: Generate version-pinned one-command installers from the signed bundle
        run: python3 scripts/release-bootstrap.py --bundle dist --public-key release/trust/teamcode-release-2026.pem
      - name: Expose the installers' SHA-256 to the desktop builds
        id: installers
        run: |
          echo "install_sh_sha256=$(sha256sum dist/install.sh | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "install_ps1_sha256=$(sha256sum dist/install.ps1 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: teamcode-installation-bundle
          path: installation-dist
      - name: Sign the compiled installation-baseline manifest
        env:
          TEAMCODE_RELEASE_SIGNING_KEY: ${{ secrets.TEAMCODE_RELEASE_SIGNING_KEY }}
        run: python3 scripts/release-signature.py sign --manifest installation-dist/manifest.json --signature installation-dist/manifest.sig --public-key release/trust/teamcode-release-2026.pem
      - uses: actions/upload-artifact@v4
        with:
          name: teamcode-signed-release-bundle
          path: dist/*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: teamcode-signed-installation-bundle
          path: installation-dist/*
          retention-days: 7
  desktop:
    # The desktop app of the same version, built on each OS once the install scripts it may run are known.
    timeout-minutes: 60
    needs: [signed_bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      DESKTOP_TARGET: ${{ matrix.target }}
      INSTALL_SH_SHA256: ${{ needs.signed_bundle.outputs.install_sh_sha256 }}
      INSTALL_PS1_SHA256: ${{ needs.signed_bundle.outputs.install_ps1_sha256 }}
      BINARIES: companion-desktop/build/compose/binaries/main
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Import the Developer ID into a temporary keychain
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12: ${{ secrets.TEAMCODE_MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.TEAMCODE_MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.TEAMCODE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.TEAMCODE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.TEAMCODE_NOTARY_ISSUER_ID }}
          TEAM_ID: ${{ vars.TEAMCODE_MACOS_TEAM_ID }}
          RELEASING: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        run: |
          present=0
          for value in "$CERTIFICATE_P12" "$CERTIFICATE_PASSWORD" "$NOTARY_KEY" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID" "$TEAM_ID"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ] && [ "$RELEASING" != true ]; then
            echo "::warning::No Developer ID configured: this validation builds an unsigned macOS app, which teamcode ui must refuse."
            echo "DESKTOP_SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$present" -ne 6 ]; then
            echo "::error::A release needs the Developer ID and notarization secrets (TEAMCODE_MACOS_CERTIFICATE_P12, TEAMCODE_MACOS_CERTIFICATE_PASSWORD, TEAMCODE_NOTARY_KEY, TEAMCODE_NOTARY_KEY_ID, TEAMCODE_NOTARY_ISSUER_ID) and the TEAMCODE_MACOS_TEAM_ID variable, all of them."
            exit 1
          fi
          keychain="$RUNNER_TEMP/teamcode-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          umask 077
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # one argument per keychain already in the search list
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -n 1)"
          case "$identity" in
            *"($TEAM_ID)") ;;
            *) echo "::error::The imported certificate is not a Developer ID Application of team $TEAM_ID."; exit 1 ;;
          esac
          {
            echo "DESKTOP_SIGNED=true"
            # Compose prefixes "Developer ID Application: " itself.
            echo "TEAMCODE_MACOS_SIGNING_IDENTITY=$identity"
            echo "TEAMCODE_MACOS_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
      - name: Build the desktop packages with the release's version and install-script hashes
        run: |
          case "$DESKTOP_TARGET" in
            macos-*) tasks=(createDistributable packageDmg) ;;
            windows-*) tasks=(packageMsi) ;;
            linux-*) tasks=(createDistributable packageDeb packageRpm) ;;
          esac
          ./gradlew "${tasks[@]/#/:companion-desktop:}" "-PteamcodeInstallShSha256=$INSTALL_SH_SHA256" "-PteamcodeInstallPs1Sha256=$INSTALL_PS1_SHA256"
      - name: Check that no jar of the macOS app hides an unsigned native library
        if: runner.os == 'macOS' && env.DESKTOP_SIGNED == 'true'
        env:
          TEAM_ID: ${{ vars.TEAMCODE_MACOS_TEAM_ID }}
        run: |
          # jpackage signs the files of the app, not the native libraries inside its jars, and notarization rejects those.
          app="$BINARIES/app/TeamCode.app"
          scratch="$(mktemp -d)"
          failed=0
          while IFS= read -r -d '' jar; do
            while IFS= read -r entry; do
              rm -rf "$scratch/entry" && mkdir "$scratch/entry"
              unzip -q -o "$jar" "$entry" -d "$scratch/entry"
              # Only Mach-O files matter to notarization: jars also carry the libraries of other systems.
              file "$scratch/entry/$entry" | grep -q 'Mach-O' || continue
              details="$(codesign -dvv "$scratch/entry/$entry" 2>&1 || true)"
              if ! grep -q "^TeamIdentifier=$TEAM_ID\$" <<< "$details" || ! grep -q '^Timestamp=' <<< "$details" || ! grep -q 'flags=.*runtime' <<< "$details"; then
                echo "::error::$(basename "$jar")!$entry is not signed with the Developer ID, a secure timestamp and the hardened runtime."
                failed=1
              fi
            done < <(unzip -Z1 "$jar" | grep -E '\.(so|dylib|jnilib)$' || true)
          done < <(find "$app" -name '*.jar' -print0)
          exit "$failed"
      - name: Notarize, staple and check the macOS app and disk image
        if: runner.os == 'macOS' && env.DESKTOP_SIGNED == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.TEAMCODE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.TEAMCODE_NOTARY_ISSUER_ID }}
          TEAM_ID: ${{ vars.TEAMCODE_MACOS_TEAM_ID }}
        run: |
          app="$BINARIES/app/TeamCode.app"
          dmg="$(ls "$BINARIES"/dmg/*.dmg)"
          # Stapling fetches the ticket from Apple's CloudKit, which drops connections now and then.
          staple() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if xcrun stapler staple "$1"; then return 0; fi
              sleep 20
            done
            return 1
          }
          notarize() {
            local result
            result="$(xcrun notarytool submit "$1" --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json)" || true
            echo "$result" | python3 -c 'import json,sys; r=json.load(sys.stdin); print("Notarization", r.get("id"), r.get("status"))'
            if [ "$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status"))')" != Accepted ]; then
              id="$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')"
              [ -n "$id" ] && xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
              return 1
            fi
          }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -qx "TeamIdentifier=$TEAM_ID"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize-app.zip"
          notarize "$RUNNER_TEMP/notarize-app.zip"
          staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          # The disk image carries its own signature, then its notarization ticket.
          codesign --force --timestamp --keychain "$TEAMCODE_MACOS_SIGNING_KEYCHAIN" --sign "Developer ID Application: $TEAMCODE_MACOS_SIGNING_IDENTITY" "$dmg"
          notarize "$dmg"
          staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - name: Stage the package teamcode ui installs and the hand-installed ones
        run: |
          version="$ORG_GRADLE_PROJECT_teamcodeVersion"
          case "$DESKTOP_TARGET" in
            macos-*)
              package="$RUNNER_TEMP/teamcode-desktop.zip"
              ditto -c -k --keepParent "$BINARIES/app/TeamCode.app" "$package"
              extras=("$BINARIES"/dmg/*.dmg) ;;
            windows-*)
              package="$(ls "$BINARIES"/msi/*.msi)"
              extras=() ;;
            linux-*)
              package="$RUNNER_TEMP/teamcode-desktop.tar.gz"
              tar -czf "$package" -C "$BINARIES/app" TeamCode
              extras=("$BINARIES"/deb/*.deb "$BINARIES"/rpm/*.rpm) ;;
          esac
          python3 scripts/release-desktop.py stage --package "$package" --target "$DESKTOP_TARGET" --version "$version" --commit "$GITHUB_SHA" --output desktop-staged
          for extra in "${extras[@]}"; do
            python3 scripts/release-desktop.py extra --package "$extra" --target "$DESKTOP_TARGET" --version "$version" --output desktop-extras
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-package-${{ matrix.target }}
          path: desktop-staged/*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: desktop-extra-${{ matrix.target }}
          path: desktop-extras/*
          retention-days: 7
      - name: Remove the temporary keychain and notarization key
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${TEAMCODE_MACOS_SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$TEAMCODE_MACOS_SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"
  desktop_manifest:
    timeout-minutes: 10
    # Signed with the publisher key, like the CLI's manifest: never for pull-request code.
    if: github.event_name != 'pull_request'
    needs: [desktop]
    runs-on: ubuntu-latest
    outputs:
      macos_signed: ${{ steps.signed.outputs.macos_signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-package-*
          merge-multiple: true
          path: desktop-staged
      - name: Verify and assemble the five desktop packages
        run: python3 scripts/release-desktop.py assemble --inputs desktop-staged --version "$ORG_GRADLE_PROJECT_teamcodeVersion" --commit "$GITHUB_SHA" --output desktop-dist
      - name: Sign desktop-manifest.json with the independent publisher key
        env:
          TEAMCODE_RELEASE_SIGNING_KEY: ${{ secrets.TEAMCODE_RELEASE_SIGNING_KEY }}
        run: python3 scripts/release-signature.py sign --manifest desktop-dist/desktop-manifest.json --signature desktop-dist/desktop-manifest.sig --public-key release/trust/teamcode-release-2026.pem
      - name: Verify the signature against the pinned public key
        run: python3 scripts/release-signature.py verify --manifest desktop-dist/desktop-manifest.json --signature desktop-dist/desktop-manifest.sig --public-key release/trust/teamcode-release-2026.pem
      - name: Tell the acceptance whether the macOS app carries the Developer ID
        id: signed
        run: echo "macos_signed=${{ secrets.TEAMCODE_MACOS_CERTIFICATE_P12 != '' && vars.TEAMCODE_MACOS_TEAM_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: teamcode-signed-desktop-bundle
          path: desktop-dist/*
          retention-days: 7
  signed_installation:
    timeout-minutes: 20
    needs: [signed_bundle, desktop_manifest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            architecture: arm64
          - os: macos-15-intel
            target: macos-x64
            architecture: x86_64
          - os: ubuntu-24.04
            target: linux-x64
            architecture: x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            architecture: aarch64
          - os: windows-latest
            target: windows-x64
            architecture: AMD64
    runs-on: ${{ matrix.os }}
    # These jobs receive public signed files, never signing or team/provider credentials.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: teamcode-signed-release-bundle
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: teamcode-signed-installation-bundle
          path: installation-dist
      - name: Install Linux transport and verification dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl3t64
      - name: Start Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          {
            echo "XDG_RUNTIME_DIR=/run/user/$(id -u)"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus"
          } >> "$GITHUB_ENV"
      - name: Exercise the actual native signed installation and owned service
        shell: bash
        env:
          INSTALLATION_TARGET: ${{ matrix.target }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python -c 'import os,platform; assert platform.machine() == os.environ["EXPECTED_ARCHITECTURE"], "Wrong runtime architecture"'
          python scripts/installation-fixture.py --first-bundle installation-dist --second-bundle dist --target "$INSTALLATION_TARGET" --output installation-fixtures
          releaseVersion="${ORG_GRADLE_PROJECT_teamcodeVersion}"
          suffix=""
          if [[ "$INSTALLATION_TARGET" == windows-* ]]; then suffix=".exe"; fi
          binary="installation-fixtures/second/teamcode-${releaseVersion}-${INSTALLATION_TARGET}${suffix}"
          python scripts/smoke-installation.py --binary "$binary" --first-bundle installation-fixtures/first --second-bundle installation-fixtures/second --notification-bundle installation-fixtures/second --service
      - name: Exercise the generated bootstrap on the actual native target
        shell: bash
        run: python scripts/smoke-bootstrap.py --bundle dist
      - name: Exercise the independent automatic update job
        shell: bash
        env:
          INSTALLATION_TARGET: ${{ matrix.target }}
        run: |
          suffix=""
          if [[ "$INSTALLATION_TARGET" == windows-* ]]; then suffix=".exe"; fi
          binary="installation-fixtures/second/teamcode-${ORG_GRADLE_PROJECT_teamcodeVersion}-${INSTALLATION_TARGET}${suffix}"
          python scripts/smoke-automatic-updates.py --binary "$binary" --first-bundle installation-fixtures/first --second-bundle installation-fixtures/second
      - uses: actions/download-artifact@v4
        with:
          name: teamcode-signed-desktop-bundle
          path: desktop-dist
      - name: Install the signed desktop app with the signed CLI of the same release
        shell: bash
        env:
          INSTALLATION_TARGET: ${{ matrix.target }}
          MACOS_SIGNED: ${{ needs.desktop_manifest.outputs.macos_signed }}
        run: |
          suffix=""
          if [[ "$INSTALLATION_TARGET" == windows-* ]]; then suffix=".exe"; fi
          cli="dist/teamcode-${ORG_GRADLE_PROJECT_teamcodeVersion}-${INSTALLATION_TARGET}${suffix}"
          chmod 755 "$cli"
          flags=()
          if [[ "$INSTALLATION_TARGET" == macos-* && "$MACOS_SIGNED" != true ]]; then flags+=(--expect-macos-refusal); fi
          python scripts/smoke-desktop-install.py --binary "$cli" --bundle desktop-dist "${flags[@]}"
  release:
    timeout-minutes: 10
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.full_validation && github.ref == 'refs/heads/main')
    needs: [image, signed_bundle, desktop_manifest, signed_installation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: teamcode-signed-release-bundle
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: teamcode-helm-chart
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: teamcode-signed-desktop-bundle
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-extra-*
          merge-multiple: true
          path: dist
      - name: Verify the exact accepted signatures before publication
        run: |
          python3 scripts/release-signature.py verify --manifest dist/manifest.json --signature dist/manifest.sig --public-key release/trust/teamcode-release-2026.pem
          python3 scripts/release-signature.py verify --manifest dist/desktop-manifest.json --signature dist/desktop-manifest.sig --public-key release/trust/teamcode-release-2026.pem
      - name: Bind accepted files to this exact source and version
        run: |
          python3 scripts/release-request.py --manifest dist/manifest.json
          python3 scripts/release-request.py --manifest dist/desktop-manifest.json
      - name: List every published file in SHA256SUMS
        run: python3 scripts/release-desktop.py sums --directory dist
      - name: Create the exact tag after all acceptance and image publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          releaseVersion="$ORG_GRADLE_PROJECT_teamcodeVersion"
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$releaseVersion" --jq '.object.sha' 2>/dev/null)"; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$releaseVersion" -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Publish the verified version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          releaseVersion="$ORG_GRADLE_PROJECT_teamcodeVersion"
          flags=()
          if [[ "$releaseVersion" == *-* ]]; then flags+=(--prerelease); fi
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ -f "docs/releases/$releaseVersion.md" ]]; then
            cp "docs/releases/$releaseVersion.md" "$notes"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$releaseVersion" --jq .body > "$notes"
          fi
          # The desktop downloads, read from the signed desktop manifest and the attached files.
          python3 scripts/release-desktop.py notes --directory dist --notes "$notes"
          gh release create "$releaseVersion" dist/* --verify-tag --notes-file "$notes" --title "$releaseVersion" "${flags[@]}" --draft
          gh release edit "$releaseVersion" --draft=false
